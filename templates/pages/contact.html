{% extends 'base.html' %}
{% block title %}Contact Us - ZoBet{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-24">
    <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2 text-center"><i class="fas fa-headset text-red-400 mr-3"></i>Contact Us</h1>
    <p class="text-gray-500 text-sm mb-10 text-center">We're here to help. Get in touch with us.</p>

    <div class="grid sm:grid-cols-3 gap-4 sm:gap-6 mb-10">
        <a href="https://wa.me/919362603236?text=Hi%20ZoBet%20Support%2C%20I%20need%20help" target="_blank" class="glass rounded-xl p-5 sm:p-6 border border-gray-700/50 text-center block hover:border-green-500/50 transition group">
            <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-green-500/20 flex items-center justify-center text-green-400 text-xl group-hover:scale-110 transition"><i class="fab fa-whatsapp"></i></div>
            <h3 class="text-white font-semibold mb-1 text-sm">WhatsApp</h3>
            <p class="text-gray-500 text-xs sm:text-sm">Chat directly with support</p>
        </a>
        <a href="mailto:support@ZoBet.com" class="glass rounded-xl p-5 sm:p-6 border border-gray-700/50 text-center block hover:border-red-500/50 transition group">
            <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-red-500/20 flex items-center justify-center text-red-400 text-xl group-hover:scale-110 transition"><i class="fas fa-envelope"></i></div>
            <h3 class="text-white font-semibold mb-1 text-sm">Email</h3>
            <p class="text-gray-500 text-xs sm:text-sm">support@ZoBet.com</p>
        </a>
        <div class="glass rounded-xl p-5 sm:p-6 border border-gray-700/50 text-center">
            <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400 text-xl"><i class="fas fa-comment"></i></div>
            <h3 class="text-white font-semibold mb-1 text-sm">Live Chat</h3>
            <p class="text-gray-500 text-xs sm:text-sm">Coming soon</p>
        </div>
    </div>

    <div class="glass rounded-2xl p-6 sm:p-8 border border-gray-700/50">
        <h2 class="text-xl font-bold text-white mb-6">Send us a message</h2>
        <form class="space-y-4">
            <div class="grid sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Your Name</label>
                    <input type="text" placeholder="John Doe" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition">
                    <input type="email" placeholder="john@example.com" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition">
                    <input type="text" placeholder="How can we help?" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition">
                    <textarea rows="5" placeholder="Describe your issue..." class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 text-white placeholder-gray-400 focus:border-red-500 focus:ring-1 focus:ring-red-500 outline-none transition"></textarea>
            </div>
            <button type="submit" class="btn-primary"><i class="fas fa-paper-plane mr-2"></i>Send Message</button>
        </form>
    </div>
</div>
{% endblock %}
