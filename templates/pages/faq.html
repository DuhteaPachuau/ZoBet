{% extends 'base.html' %}
{% block title %}FAQ - ZoBet{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-24">
    <h1 class="text-3xl sm:text-4xl font-bold text-white mb-2 text-center"><i class="fas fa-question-circle text-red-400 mr-3"></i>Frequently Asked Questions</h1>
    <p class="text-gray-500 text-sm mb-10 text-center">Everything you need to know</p>

    <div class="space-y-3 sm:space-y-4">
        {% for item in faq_items %}
        <div class="glass rounded-xl sm:rounded-2xl border border-gray-700/50 overflow-hidden">
            <button class="w-full px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between text-left hover:bg-white/5 transition" onclick="this.nextElementSibling.classList.toggle('hidden'); this.querySelector('i.chevron').classList.toggle('rotate-180')">
                <span class="text-white font-medium text-sm sm:text-base pr-4">{{ item.q }}</span>
                <i class="chevron fas fa-chevron-down text-gray-500 text-xs flex-shrink-0 transition-transform"></i>
            </button>
            <div class="hidden px-4 sm:px-6 pb-3 sm:pb-4">
                <p class="text-gray-400 text-xs sm:text-sm leading-relaxed">{{ item.a }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
